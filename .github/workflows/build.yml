name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag (release builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Bump patch version (every dev build +1)
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OLD_V=$(node -p "require('./package.json').version")
          NEW_V=$(npm version patch --no-git-tag-version | sed 's/^v//')
          echo "APP_VERSION=$NEW_V" >> "$GITHUB_ENV"
          git add package.json package-lock.json
          git commit -m "chore: bump version v$OLD_V -> v$NEW_V [skip ci]"
          git push || echo "::warning::version bump push failed, building with local version"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (electron-vite)
        run: npm run build

      - name: Package NSIS installer
        run: npx electron-builder --win --config electron-builder.yml --publish never
        env:
          # 无代码签名证书，跳过签名探测
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOOGLEd-Windows-x64
          path: release/*/*.exe
          if-no-files-found: error

      - name: Publish release (every build)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: release/*/*.exe
          generate_release_notes: true
